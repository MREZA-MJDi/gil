name: Restaurant dashboard checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, pdo, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload resolved lockfile for repository sync
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Test API client
        run: npm run test:js

      - name: Build frontend
        run: npm run build

      - name: Run Laravel feature tests
        run: php artisan test
